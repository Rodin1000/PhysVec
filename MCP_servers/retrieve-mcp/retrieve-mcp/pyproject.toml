[project]
name = "mcp-server-retrieve"
version = "0.1.0"
authors = [
    {name = "QMB Author"},
]
description = "MCP server for RAG retrieval using vector similarity and BM25 keyword matching"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "server", "rag", "retrieval", "vector-search", "bm25"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.3.0",
    "mcp[server]>=1.3.0",
    "mcp[cli]>=1.3.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
mcp-server-retrieve = "mcp_server_retrieve.main:main"

[project.urls]
"Homepage" = "https://github.com/QMB_author/mcp_server_retrieve"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

