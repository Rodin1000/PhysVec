[project]
name = "mcp-server-program-dft"
version = "0.1.0"
description = "MCP server for ORCA DFT calculations"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2"]

[project.scripts]
mcp-server-program-dft = "mcp_server_program_dft.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
