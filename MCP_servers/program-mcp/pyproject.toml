[project]
name = "mcp-server-program"
version = "0.1.0"
authors = [
    {name = "QMB Author"},
]
description = "MCP server for executing Python and Julia code files within a sandboxed directory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "server", "code-execution", "python", "julia", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.3.0",
    "mcp[server]>=1.3.0",
    "mcp[cli]>=1.3.0",
]

[project.scripts]
mcp-server-program = "mcp_server_program.main:main"

[project.urls]
"Homepage" = "https://github.com/QMB_author/mcp_server_program"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

